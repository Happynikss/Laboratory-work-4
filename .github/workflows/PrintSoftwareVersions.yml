name: Print Software Versions
on: [push]

jobs:
  PrintLanguageVersions:
    runs-on: ubuntu-latest
    steps:
      - name: Print Python Version (Business Logic Level)
        run: python --version

  PrintDBMSVersions:
    runs-on: ubuntu-latest
    needs: [PrintLanguageVersions]
    steps:
      - name: Print PostgreSQL Version (Access Level / Relational DB for Oracle-like schema)
        run: psql --version
